<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{% if page.summary %}{{ page.summary }}{% else %}{{ site.description }}{% endif %}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark">MA</span>
          <span class="brand-copy">
            <strong>{{ site.title }}</strong>
            <small>{{ site.description }}</small>
          </span>
        </a>
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}#reading-path">阅读顺序</a>
          <a href="{{ '/' | relative_url }}#notes">笔记目录</a>
          <a href="https://github.com/yang4fun/multi-agent-framework-for-PM">GitHub</a>
        </nav>
      </header>

      <main class="site-main">
        {{ content }}
      </main>

      <footer class="site-footer">
        <p>Built with GitHub Pages for public reading. Repository stays on GitHub; notes stay readable on the web.</p>
      </footer>
    </div>
  </body>
</html>
